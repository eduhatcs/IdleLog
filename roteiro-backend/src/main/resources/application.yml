server:
  # Em serviços como Render/Railway, a plataforma define PORT.
  port: ${PORT:8080}

spring:
  application:
    name: roteiro-backend

  datasource:
    url: jdbc:postgresql://localhost:5433/roteiro_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  sql:
    init:
      mode: always
      data-locations: classpath:dados-demo.sql

# Origens autorizadas a chamar a API pelo navegador (CORS).
# Em produção, prefira sobrescrever pela variável de ambiente
# APP_CORS_ALLOWED_ORIGINS=https://eduhatcs.github.io
app:
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://localhost:4173
      - https://eduhatcs.github.io

# Reservado para o módulo de indicadores/dashboard (RF08-RF11, RN04),
# que não faz parte deste entregável (cadastros + montagem de roteiro).
roteiro:
  jornada-padrao-horas: 8
